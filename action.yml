name: Red Team PR
description: Claude red-teams the PR diff; only findings proven by a failing test are reported.

inputs:
  anthropic-api-key:
    description: Anthropic API key (pass a secret). Empty → the run is skipped.
    required: false
    default: ""
  model:
    description: Claude model ID
    default: claude-opus-5-5
  fail-on:
    description: Lowest confirmed severity that fails the check (low, medium, high, critical, none)
    default: high
  max-chars:
    description: Skip PRs whose prompt is larger than this many characters
    default: "200000"
  github-token:
    description: Token used to post the PR comment
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install red team dependencies
      shell: bash
      run: python3 -m pip install --quiet anthropic==1.15.0 pytest==9.1.1

    - name: Attack (Claude call; only step with the API key)
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        REDTEAM_STATE: ${{ runner.temp }}/redteam-state.json
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_MAX_CHARS: ${{ inputs.max-chars }}
      run: python3 -m redteam.cli attack

    - name: Verify (no key, no network, proofs run as an unprivileged user)
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        REDTEAM_STATE: ${{ runner.temp }}/redteam-state.json
      run: bash "${{ github.action_path }}/redteam/verify-sandboxed.sh"

    - name: Report (PR comment + fail-on gate)
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        REDTEAM_STATE: ${{ runner.temp }}/redteam-state.json
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: python3 -m redteam.cli report
